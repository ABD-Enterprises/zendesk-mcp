name: CI

# Every job runs on the runner labels in the repository variable
# LINUX_RUNNER_LABELS. The expression has no fallback on purpose: if the
# variable is missing, `fromJSON` fails and the job does not start, instead
# of running pull-request code on the operator's own hardware.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Pull-request runs share a group per pull request, so a new push supersedes
  # the one in flight. Every other run is keyed by its run id: GitHub keeps at
  # most one pending run per group, so sharing a group would drop a queued
  # push-to-main run even with cancel-in-progress off.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 25 successful runs: every job in this
    # workflow finished in under 0.5 min of running time.
    timeout-minutes: 10
    strategy:
      matrix:
        node-version:
          - 20
          - 22
          - 24
    defaults:
      run:
        working-directory: plugins/zendesk-connector
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plugins/zendesk-connector/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Run the hermetic end-to-end harness
        # The harness binds an ephemeral loopback port against a mock
        # Zendesk: it needs no account, no network and no credentials, so it
        # can gate a merge.
        run: npm run e2e:mock
      - run: npm pack --dry-run
      - name: Audit production dependencies
        # A moderate advisory is a live signal too: the gate used to be
        # `high`, which let one pass silently.
        run: npm audit --omit=dev --audit-level=moderate

  validate-plugin:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 25 successful runs: every job in this
    # workflow finished in under 0.5 min of running time.
    timeout-minutes: 10
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin structure
        run: |
          test -f plugins/zendesk-connector/.codex-plugin/plugin.json
          test -f plugins/zendesk-connector/.mcp.json
          node -e 'JSON.parse(require("fs").readFileSync("plugins/zendesk-connector/.codex-plugin/plugin.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("plugins/zendesk-connector/.mcp.json"))'

  changelog:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 25 successful runs: every job in this
    # workflow finished in under 0.5 min of running time.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Check the changelog structure
        run: node scripts/check-changelog.mjs
      - name: Run the changelog check self-tests
        run: node scripts/check-changelog.mjs --self-test

  manifest-preflight:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 25 successful runs: every job in this
    # workflow finished in under 0.5 min of running time.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Run the manifest preflight self-tests
        run: node --test scripts/manifest-preflight.test.mjs
      - name: Run the release tag guard self-tests
        run: node --test scripts/release-tag.test.mjs

  container:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 25 successful runs: every job in this
    # workflow finished in under 0.5 min of running time.
    timeout-minutes: 10
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container image
        run: docker build -t zendesk-mcp:test plugins/zendesk-connector

  console:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 25 successful runs: every job in this
    # workflow finished in under 0.5 min of running time.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/operations-console
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/operations-console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  sbom:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 25 successful runs: every job in this
    # workflow finished in under 0.5 min of running time.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SBOM is built from the checked out files (the npm lock file in
      # plugins/zendesk-connector lists the dependency tree), not from Git
      # history, so the default shallow checkout is enough and no Git metadata
      # is needed here.
      # anchore/sbom-action v0.20.6 ships Syft v1.33.0. The output file name
      # is set explicitly, so the artifact holds one CycloneDX JSON document
      # under a stable name.
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: plugins/zendesk-connector
          format: cyclonedx
          output-file: connector.cdx.json
      # The action writes the file relative to the workspace. The pattern
      # matches that file in the workspace root and in the scanned directory,
      # and a missing SBOM fails the job instead of leaving an empty artifact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connector-sbom
          path: '**/connector.cdx.json'
          if-no-files-found: error
          retention-days: 30

  workflow-lint:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 25 successful runs: every job in this
    # workflow finished in under 0.5 min of running time.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      # actionlint is pinned to one released version, and the SHA256 of every
      # runner archive is pinned here instead of being fetched from the release
      # page. The digests below belong to actionlint 1.7.12, so a replaced or
      # truncated download fails this job instead of being linted.
      - name: Lint the workflow files with actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          version="${ACTIONLINT_VERSION:?}"
          machine="$(uname -m)"
          case "$machine" in
            x86_64|amd64) arch="amd64" ;;
            aarch64|arm64) arch="arm64" ;;
            *)
              echo "Unsupported runner architecture: ${machine}" >&2
              exit 1
              ;;
          esac
          case "$arch" in
            amd64)
              expected="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
              ;;
            arm64)
              expected="325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
              ;;
          esac
          archive="actionlint_${version}_linux_${arch}.tar.gz"
          base_url="https://github.com/rhysd/actionlint/releases/download/v${version}"
          workdir="${RUNNER_TEMP:-/tmp}/actionlint-${version}-${arch}"
          rm -rf -- "${workdir:?}"
          mkdir -p "$workdir"
          curl --fail --location --silent --show-error --retry 3 \
            --output "${workdir}/${archive}" "${base_url}/${archive}"
          actual="$(sha256sum "${workdir}/${archive}" | awk '{ print $1 }')"
          if [ "$actual" != "$expected" ]; then
            echo "Checksum mismatch for ${archive}: expected ${expected}, got ${actual}." >&2
            exit 1
          fi
          tar -xzf "${workdir}/${archive}" -C "$workdir"
          if [ ! -f "${workdir}/actionlint" ]; then
            echo "The actionlint ${version} archive holds no actionlint binary." >&2
            exit 1
          fi
          chmod +x "${workdir}/actionlint"
          workflow_files=()
          while IFS= read -r file; do
            workflow_files+=("$file")
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | LC_ALL=C sort)
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "No workflow files found in .github/workflows." >&2
            exit 1
          fi
          echo "Linting workflow files: ${workflow_files[*]}"
          if ! "${workdir}/actionlint" "${workflow_files[@]}"; then
            echo "actionlint reported errors in the workflow files." >&2
            exit 1
          fi
      # A truncated commit SHA in a `uses:` pin is not an actionlint error, but
      # GitHub refuses to start the workflow at all, so the run fails without a
      # log that names the cause. The script reports the offending pin instead.
      - name: Check the action pins in the workflow files
        shell: bash
        run: bash .github/scripts/check-action-pins.sh
      - name: Run the action pin check self-tests
        shell: bash
        run: node --test scripts/action-pins.test.mjs

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS) }}
    # Measured 2026-10-31 over the last 25 successful runs: every job in this
    # workflow finished in under 0.5 min of running time.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # dependency-review-action v5 needs a runner at v2.327.1 or newer (node24
      # runtime). Defaults fail the job on low severity and above for
      # runtime-scoped changes only (fail_on_scopes defaults to runtime, so a
      # dev-only dependency addition does not fail) and run the license check.
      # No PR comment or SARIF upload is configured, so contents: read
      # suffices. The action reads the event's base/head SHAs through the API
      # and never the workspace, so no checkout is needed.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
