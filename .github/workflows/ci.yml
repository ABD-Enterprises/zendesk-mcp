name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux","ARM64","docker"]') }}
    strategy:
      matrix:
        node-version:
          - 20
          - 22
          - 24
    defaults:
      run:
        working-directory: plugins/zendesk-connector
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: plugins/zendesk-connector/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  validate-plugin:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux","ARM64","docker"]') }}
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate plugin structure
        run: |
          test -f plugins/zendesk-connector/.codex-plugin/plugin.json
          test -f plugins/zendesk-connector/.mcp.json
          node -e 'JSON.parse(require("fs").readFileSync("plugins/zendesk-connector/.codex-plugin/plugin.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("plugins/zendesk-connector/.mcp.json"))'

  container:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux","ARM64","docker"]') }}
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container image
        run: docker build -t zendesk-mcp:test plugins/zendesk-connector
